<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Remote Control</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; height:100%;
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #pad { position:relative; flex:1 1 auto; min-height:0; }
  #screen { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block;
            user-select:none; -webkit-user-drag:none; }

  #bar { flex:0 0 auto; display:flex; gap:2px; box-sizing:border-box;
         height:calc(clamp(64px, 15vh, 110px) + env(safe-area-inset-bottom, 0px));
         padding-bottom:env(safe-area-inset-bottom, 0px);
         background:#050506; border-top:1px solid #26262b; }
  .tp { background:#17171a; position:relative; display:flex; align-items:center; justify-content:center;
        transition:background .08s; }
  .tp.on { background:#2e2e35; }
  #btnL, #btnR { flex:1 1 0; }
  #btnL { border-bottom-left-radius:12px; }
  #btnR { border-bottom-right-radius:12px; }
  #wheel { flex:0 0 clamp(56px, 14vw, 84px); flex-direction:column; justify-content:space-between;
           padding:10px 0; box-sizing:border-box; }
  #wheel svg { width:18px; height:18px; fill:none; stroke:#6c6c76; stroke-width:2.4;
               stroke-linecap:round; stroke-linejoin:round; }
  #wheel .grip { width:3px; flex:1; margin:6px 0; border-radius:2px;
                 background:repeating-linear-gradient(#34343b 0 2px, transparent 2px 7px); }

  #cursor {
    position:absolute; left:0; top:0; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:#f22; border:1px solid #fff; box-sizing:border-box;
    pointer-events:none; display:none; will-change:transform;
  }
  #status {
    position:absolute; top:8px; left:8px; color:#0f0; font:12px monospace;
    background:rgba(0,0,0,0.4); padding:2px 6px; border-radius:4px; pointer-events:none;
  }
  #kbBtn { position:absolute; right:8px; top:8px; width:44px; height:34px; border-radius:8px;
           background:rgba(30,30,34,.85); color:#ddd; border:1px solid #3a3a42; z-index:5;
           font:18px/32px sans-serif; text-align:center; }
  #kbBtn.open { background:#2e7d32; }
  #kbPanel { display:none; position:absolute; left:0; right:0; z-index:6; box-sizing:border-box;
             bottom:calc(clamp(64px, 15vh, 110px) + env(safe-area-inset-bottom, 0px));
             background:#0b0b0d; border-top:1px solid #26262b; padding:6px; }
  #kbPanel.open { display:block; }
  .kbRow { display:flex; gap:4px; margin-bottom:4px; }
  .kbRow:last-child { margin-bottom:0; }
  .kbRow button { flex:1 1 0; min-width:0; height:38px; padding:0; border:0; border-radius:7px;
                  background:#1e1e23; color:#e6e6e6; font:13px sans-serif; }
  .kbRow button.on { background:#2e7d32; }
  .kbRow button:active { background:#34343b; }
  #kbFnRows { display:none; }
  #kbFnRows.open { display:block; }
  #kbInput { position:absolute; left:-9999px; top:0; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="pad">
    <canvas id="screen"></canvas>
  </div>
  <div id="bar">
    <div id="btnL" class="tp"></div>
    <div id="wheel" class="tp">
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      <div class="grip"></div>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div id="btnR" class="tp"></div>
  </div>
  <div id="cursor"></div>
  <div id="kbBtn">&#9000;</div>
  <input id="kbInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" inputmode="text" enterkeyhint="send">
  <div id="kbPanel">
    <div id="kbFnRows">
      <div class="kbRow">
        <button data-k="f1">F1</button><button data-k="f2">F2</button><button data-k="f3">F3</button>
        <button data-k="f4">F4</button><button data-k="f5">F5</button><button data-k="f6">F6</button>
      </div>
      <div class="kbRow">
        <button data-k="f7">F7</button><button data-k="f8">F8</button><button data-k="f9">F9</button>
        <button data-k="f10">F10</button><button data-k="f11">F11</button><button data-k="f12">F12</button>
      </div>
    </div>
    <div class="kbRow">
      <button data-k="esc">Esc</button><button data-k="tab">Tab</button>
      <button data-m="ctrl">Ctrl</button><button data-m="alt">Alt</button>
      <button data-m="shift">Shift</button><button data-m="win">Win</button>
      <button id="kbText">Aa</button>
    </div>
    <div class="kbRow">
      <button data-k="backspace" data-rep="1">&#9003;</button><button data-k="delete" data-rep="1">Del</button>
      <button data-k="home">Home</button><button data-k="end">End</button>
      <button data-k="pageup" data-rep="1">PgUp</button><button data-k="pagedown" data-rep="1">PgDn</button>
    </div>
    <div class="kbRow">
      <button data-k="left" data-rep="1">&larr;</button><button data-k="down" data-rep="1">&darr;</button>
      <button data-k="up" data-rep="1">&uarr;</button><button data-k="right" data-rep="1">&rarr;</button>
      <button data-k="enter">Enter</button><button data-k="space" data-rep="1">Space</button>
    </div>
    <div class="kbRow">
      <button data-combo="ctrl+c">Copy</button><button data-combo="ctrl+v">Paste</button>
      <button data-combo="ctrl+x">Cut</button><button data-combo="ctrl+z">Undo</button>
      <button data-combo="ctrl+a">All</button><button data-combo="alt+tab">Alt+Tab</button>
      <button id="kbFnBtn">Fn</button>
    </div>
  </div>
  <div id="status">подключение...</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.expand();
tg?.ready();
try { tg?.disableVerticalSwipes?.(); } catch (e) {}

const params = new URLSearchParams(location.search);
let rawWsUrl = params.get("ws");
const TOKEN  = params.get("token");

// Автоматический перевод ws:// в wss:// при открытии с GitHub Pages (HTTPS)
if (rawWsUrl && location.protocol === "https:" && rawWsUrl.startsWith("ws://")) {
  rawWsUrl = "wss://" + rawWsUrl.slice(5);
}

const WS_URL = rawWsUrl;
const screenCanvas = document.getElementById("screen");
const screenCtx    = screenCanvas.getContext("2d", { alpha: false, desynchronized: true });
const cursorEl     = document.getElementById("cursor");
const statusEl     = document.getElementById("status");

let screenOk = false, ctrlOk = false;
let fpsText = "";

function updateStatus() {
  statusEl.textContent = `экран: ${screenOk ? "OK" : "—"} | fps: ${fpsText}`;
}

if (!WS_URL || !TOKEN) {
  statusEl.textContent = "ошибка: нет ws/token в ссылке";
} else {
  if (typeof VideoDecoder === "undefined") {
    statusEl.textContent = "ошибка: WebCodecs не поддерживается";
  }

  const screenWs = new WebSocket(`${WS_URL}?token=${encodeURIComponent(TOKEN)}`);
  screenWs.binaryType = "arraybuffer";
  screenWs.onopen  = () => { screenOk = true; updateStatus(); };
  screenWs.onclose = () => { screenOk = false; updateStatus(); };
  screenWs.onerror = () => { statusEl.textContent = "экран: ошибка соединения"; };

  let decoder = null, needKey = true, chunkTs = 0;
  let latestFrame = null, needDraw = false;
  let drawnFrames = 0, ackBatch = 0;
  const FRAME_US = 1000000 / 60;
  const MAX_DECODE_QUEUE = 6;

  function codecFromKeyframe(u8) {
    for (let i = 0; i + 6 < u8.length; i++) {
      let isStart = (u8[i] === 0 && u8[i+1] === 0 && u8[i+2] === 1);
      let nalOffset = i + 3;
      if (!isStart && u8[i] === 0 && u8[i+1] === 0 && u8[i+2] === 0 && u8[i+3] === 1) {
        isStart = true;
        nalOffset = i + 4;
      }
      if (isStart && nalOffset + 3 < u8.length && (u8[nalOffset] & 0x1f) === 7) {
        const h = (b) => b.toString(16).padStart(2, "0");
        return "avc1." + h(u8[nalOffset + 1]) + h(u8[nalOffset + 2]) + h(u8[nalOffset + 3]);
      }
    }
    return "avc1.42e01f";
  }

  function resetDecoder() {
    try { if (decoder && decoder.state !== "closed") decoder.close(); } catch (e) {}
    decoder = null; needKey = true;
  }

  function createDecoder(codec) {
    decoder = new VideoDecoder({
      output: (frame) => {
        if (latestFrame) latestFrame.close();
        latestFrame = frame;
        needDraw = true;
      },
      error: () => { resetDecoder(); },
    });
    decoder.configure({ codec, optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
  }

  let serverCursor = null, localCursor = null, localUntil = 0;

  screenWs.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      try {
        const d = JSON.parse(ev.data);
        if (d.type === "cursor") serverCursor = d;
      } catch (e) {}
      return;
    }

    // Отправка пакета ACK раз в 5 кадров для устранения задержек сетевой очереди
    ackBatch++;
    if (ackBatch >= 5) {
      if (screenWs.readyState === WebSocket.OPEN) screenWs.send("a:5");
      ackBatch = 0;
    }

    const u8 = new Uint8Array(ev.data);
    if (typeof VideoDecoder === "undefined") return;

    const key = u8[0] === 1;
    const data = u8.subarray(1);

    if (!decoder || decoder.state === "closed") {
      if (!key) return;
      const codec = codecFromKeyframe(data);
      try { createDecoder(codec); } catch (e) { resetDecoder(); return; }
    }

    if (needKey && !key) return;
    if (decoder.decodeQueueSize > MAX_DECODE_QUEUE) { needKey = true; return; }
    if (key) needKey = false;

    try {
      decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: chunkTs, data }));
      chunkTs += FRAME_US;
    } catch (e) { resetDecoder(); }
  };

  function layout() {
    const r  = screenCanvas.getBoundingClientRect();
    const nw = screenCanvas.width  || r.width;
    const nh = screenCanvas.height || r.height;
    const scale = Math.min(r.width / nw, r.height / nh);
    const dw = nw * scale, dh = nh * scale;
    return { offX: r.left + (r.width - dw) / 2, offY: r.top + (r.height - dh) / 2, dw, dh };
  }

  function render() {
    if (needDraw && latestFrame) {
      const w = latestFrame.displayWidth, h = latestFrame.displayHeight;
      if (screenCanvas.width !== w || screenCanvas.height !== h) {
        screenCanvas.width = w;
        screenCanvas.height = h;
      }
      screenCtx.drawImage(latestFrame, 0, 0);
      needDraw = false;
      drawnFrames++;
    }

    const c = (performance.now() < localUntil && localCursor) ? localCursor : serverCursor;
    if (c) {
      const L = layout();
      cursorEl.style.display = "block";
      cursorEl.style.transform = `translate(${L.offX + c.x * L.dw}px, ${L.offY + c.y * L.dh}px)`;
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  let lastDrawn = 0;
  setInterval(() => {
    fpsText = String(drawnFrames - lastDrawn);
    lastDrawn = drawnFrames;
    updateStatus();
  }, 1000);

  // Канал управления
  let ctrlWsUrl = WS_URL.replace(/\/ws\/screen\/?$/, "/ws/control");
  let ctrlWs = null, ctrlTimer = null, lastCtrlRx = 0;
  const queue = [];

  function connectCtrl() {
    clearTimeout(ctrlTimer);
    if (ctrlWs && (ctrlWs.readyState === WebSocket.OPEN || ctrlWs.readyState === WebSocket.CONNECTING)) return;
    const ws = new WebSocket(`${ctrlWsUrl}?token=${encodeURIComponent(TOKEN)}`);
    ctrlWs = ws;
    ws.onopen = () => {
      if (ctrlWs !== ws) return;
      ctrlOk = true; lastCtrlRx = performance.now(); updateStatus();
      while (queue.length) ws.send(queue.shift());
    };
    ws.onmessage = () => { lastCtrlRx = performance.now(); };
    ws.onclose = () => {
      if (ctrlWs !== ws) return;
      ctrlOk = false; updateStatus();
      ctrlTimer = setTimeout(connectCtrl, 1500);
    };
  }

  function reviveCtrl(force) {
    if (force && ctrlWs) {
      const old = ctrlWs; ctrlWs = null; ctrlOk = false; updateStatus();
      try { old.close(); } catch (e) {}
    }
    connectCtrl();
  }
  connectCtrl();

  setInterval(() => {
    if (ctrlWs && ctrlWs.readyState === WebSocket.OPEN) {
      if (performance.now() - lastCtrlRx > 6000) reviveCtrl(true);
      else ctrlWs.send('{"type":"ping"}');
    }
  }, 2000);

  function send(obj) {
    if (obj.x !== undefined) {
      localCursor = { x: obj.x, y: obj.y };
      localUntil = performance.now() + 300;
    }
    const s = JSON.stringify(obj);
    if (ctrlWs && ctrlWs.readyState === WebSocket.OPEN) ctrlWs.send(s);
    else if (queue.length < 50) queue.push(s);
  }

  const SENS = 1.6, ACCEL = 0.5, ACCEL_MAX = 3, TAP_MAX_MS = 250, TAP_MOVE_PX = 8, SEND_MS = 16, SCROLL_STEP = 22;
  const padEl = document.getElementById("pad");
  const btnLEl = document.getElementById("btnL");
  const btnREl = document.getElementById("btnR");
  const wheelEl = document.getElementById("wheel");

  function findById(list, id) {
    for (const t of list) if (t.identifier === id) return t;
    return null;
  }

  let padTouch = null;
  const pending = { dx: 0, dy: 0 };
  let lastRel = 0;

  function flushRel() {
    if (pending.dx || pending.dy) {
      send({ type: "rel", dx: pending.dx, dy: pending.dy });
      pending.dx = pending.dy = 0;
    }
    lastRel = performance.now();
  }

  padEl.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (padTouch) return;
    const t = e.changedTouches[0];
    const now = performance.now();
    padTouch = { id: t.identifier, x: t.clientX, y: t.clientY, sx: t.clientX, sy: t.clientY, t0: now, tm: now, moved: false };
  }, { passive: false });

  padEl.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (!padTouch) return;
    const t = findById(e.changedTouches, padTouch.id);
    if (!t) return;
    const now = performance.now();

    if (!padTouch.moved) {
      if (Math.hypot(t.clientX - padTouch.sx, t.clientY - padTouch.sy) < TAP_MOVE_PX) return;
      padTouch.moved = true;
      padTouch.x = t.clientX; padTouch.y = t.clientY; padTouch.tm = now;
      return;
    }

    const dxp = t.clientX - padTouch.x, dyp = t.clientY - padTouch.y;
    const speed = Math.hypot(dxp, dyp) / Math.max(1, now - padTouch.tm);
    const gain = SENS * Math.min(1 + speed * ACCEL, ACCEL_MAX);
    const L = layout();
    if (L.dw > 0 && L.dh > 0) {
      pending.dx += dxp / L.dw * gain;
      pending.dy += dyp / L.dh * gain;
    }
    padTouch.x = t.clientX; padTouch.y = t.clientY; padTouch.tm = now;
    if (now - lastRel >= SEND_MS) flushRel();
  }, { passive: false });

  padEl.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (!padTouch) return;
    if (!findById(e.changedTouches, padTouch.id)) return;
    flushRel();
    if (!padTouch.moved && performance.now() - padTouch.t0 <= TAP_MAX_MS) {
      send({ type: "click", button: "left" });
    }
    padTouch = null;
  }, { passive: false });

  padEl.addEventListener("touchcancel", () => { flushRel(); padTouch = null; });

  const releasers = [];

  function bindButton(el, button) {
    let id = null;
    function release() {
      if (id === null) return;
      id = null;
      el.classList.remove("on");
      send({ type: "up", button });
    }
    releasers.push(release);

    el.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (id !== null) return;
      id = e.changedTouches[0].identifier;
      el.classList.add("on");
      send({ type: "down", button });
    }, { passive: false });

    el.addEventListener("touchend", (e) => {
      e.preventDefault();
      if (id !== null && findById(e.changedTouches, id)) release();
    }, { passive: false });

    el.addEventListener("touchcancel", () => release());
  }
  bindButton(btnLEl, "left");
  bindButton(btnREl, "right");

  let wheelTouch = null;

  wheelEl.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (wheelTouch) return;
    const t = e.changedTouches[0];
    wheelTouch = { id: t.identifier, y: t.clientY, acc: 0 };
    wheelEl.classList.add("on");
  }, { passive: false });

  wheelEl.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (!wheelTouch) return;
    const t = findById(e.changedTouches, wheelTouch.id);
    if (!t) return;
    wheelTouch.acc += t.clientY - wheelTouch.y;
    wheelTouch.y = t.clientY;
    const n = Math.trunc(wheelTouch.acc / SCROLL_STEP);
    if (n) {
      wheelTouch.acc -= n * SCROLL_STEP;
      send({ type: "scroll", dy: -n });
    }
  }, { passive: false });

  function endWheel(e) {
    if (!wheelTouch) return;
    if (e && !findById(e.changedTouches, wheelTouch.id)) return;
    wheelTouch = null;
    wheelEl.classList.remove("on");
  }
  wheelEl.addEventListener("touchend", (e) => { e.preventDefault(); endWheel(e); }, { passive: false });
  wheelEl.addEventListener("touchcancel", () => endWheel());

  function resetInput() {
    flushRel(); padTouch = null;
    wheelTouch = null; wheelEl.classList.remove("on");
    releasers.forEach(r => r());
  }
  let envTimer = null;
  function onEnvChange() {
    resetInput();
    clearTimeout(envTimer);
    envTimer = setTimeout(() => reviveCtrl(true), 300);
  }
  window.addEventListener("resize", onEnvChange);
  window.addEventListener("orientationchange", onEnvChange);
  window.addEventListener("pagehide", resetInput);
  document.addEventListener("visibilitychange", () => {
    resetInput();
    if (!document.hidden) reviveCtrl(true);
  });
  tg?.onEvent?.("viewportChanged", onEnvChange);

  const kbBtn = document.getElementById("kbBtn");
  const kbPanel = document.getElementById("kbPanel");
  const kbIn = document.getElementById("kbInput");
  const kbTextBtn = document.getElementById("kbText");
  const stickyMods = new Set();
  let textMode = false, composing = false;

  function clearMods() {
    stickyMods.clear();
    kbPanel.querySelectorAll("[data-m]").forEach((b) => b.classList.remove("on"));
  }
  function sendKey(key, extraMods) {
    const mods = Array.from(new Set([...stickyMods, ...(extraMods || [])]));
    send({ type: "key", key, mods });
    clearMods();
  }
  function sendText(s) {
    if (!s) return;
    if (stickyMods.size && s.length === 1 && /^[a-z0-9]$/i.test(s)) { sendKey(s.toLowerCase()); return; }
    send({ type: "text", s });
  }
  function resetKbInput() {
    kbIn.value = " ";
    try { kbIn.setSelectionRange(1, 1); } catch (e) {}
  }
  function setTextMode(on) {
    textMode = on;
    kbTextBtn.classList.toggle("on", on);
    if (on) { resetKbInput(); kbIn.focus({ preventScroll: true }); } else kbIn.blur();
  }

  function fireBtn(b) {
    if (b.dataset.m) {
      const m = b.dataset.m;
      if (stickyMods.has(m)) { stickyMods.delete(m); b.classList.remove("on"); }
      else { stickyMods.add(m); b.classList.add("on"); }
    } else if (b.dataset.k) {
      sendKey(b.dataset.k);
    } else if (b.dataset.combo) {
      const p = b.dataset.combo.split("+");
      sendKey(p.pop(), p);
    } else if (b.id === "kbText") {
      setTextMode(!textMode);
      return;
    } else if (b.id === "kbFnBtn") {
      document.getElementById("kbFnRows").classList.toggle("open");
      b.classList.toggle("on");
    }
    if (textMode) kbIn.focus({ preventScroll: true });
  }

  kbPanel.querySelectorAll("button").forEach((b) => {
    let t1 = null, t2 = null;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      fireBtn(b);
      if (b.dataset.rep) t1 = setTimeout(() => { t2 = setInterval(() => fireBtn(b), 55); }, 380);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
  });

  kbBtn.addEventListener("click", () => {
    const open = !kbPanel.classList.contains("open");
    kbPanel.classList.toggle("open", open);
    kbBtn.classList.toggle("open", open);
    if (!open) { clearMods(); setTextMode(false); }
  });

  kbIn.addEventListener("compositionstart", () => { composing = true; });
  kbIn.addEventListener("compositionend", (e) => {
    composing = false;
    sendText(e.data);
    resetKbInput();
  });
  kbIn.addEventListener("beforeinput", (e) => {
    if (composing || e.isComposing) return;
    const t = e.inputType;
    if (t === "insertText" && e.data) sendText(e.data);
    else if (t === "insertLineBreak" || t === "insertParagraph") sendKey("enter");
    else if (t === "deleteContentBackward") sendKey("backspace");
    else if (t === "deleteContentForward") sendKey("delete");
    e.preventDefault();
  });
  kbIn.addEventListener("keydown", (e) => {
    const map = { Enter: "enter", Backspace: "backspace", Delete: "delete", Escape: "esc", Tab: "tab",
                  ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
    const k = map[e.key];
    if (k) { e.preventDefault(); sendKey(k); }
  });
  kbIn.addEventListener("blur", () => {
    setTimeout(() => {
      if (textMode && document.activeElement !== kbIn) { textMode = false; kbTextBtn.classList.remove("on"); }
    }, 250);
  });

  document.addEventListener("contextmenu", (e) => e.preventDefault());
}
</script>
</body>
</html>
